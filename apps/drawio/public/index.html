<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagrams.net — FynnCloud</title>
  <script src="https://cdn.jsdelivr.net/npm/@fynncloud/app-bridge@0.1/dist/app-bridge.global.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    html.dark, html.dark body {
      background-color: #121215;
    }
    #drawio-iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.9);
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      z-index: 10;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }
    html.dark .loading-overlay {
      background: rgba(18, 18, 21, 0.9);
      color: #f4f4f5;
    }
    .loading-overlay.hidden {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-overlay">Loading Diagrams.net...</div>
  <iframe
    id="drawio-iframe"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    const BLANK_DIAGRAM = `<mxfile host="app.diagrams.net"><diagram id="diagram" name="Page-1"><mxGraphModel dx="1422" dy="794" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="1169" pageHeight="827" math="0" shadow="0"><root><mxCell id="0"/><mxCell id="1" parent="0"/></root></mxGraphModel></diagram></mxfile>`;

    const urlParams = new URLSearchParams(window.location.search);
    const isDark = urlParams.get('theme') === 'dark';

    // The host always hands us an existing file; we only ever read and write that file ID.
    let fileId = urlParams.get('fileId') || null;
    let fileName = urlParams.get('fileName') || urlParams.get('name') || 'Diagram.drawio';
    let currentXml = null;
    let drawioReady = false;
    let loading = false;
    let isSaving = false;
    let queuedXml = null;

    if (isDark) {
      document.documentElement.classList.add('dark');
    }

    const iframe = document.getElementById('drawio-iframe');
    const loadingEl = document.getElementById('loading');

    function setFile(id, name) {
      if (name) fileName = name;
      document.title = `${fileName} — Diagrams.net`;
      if (id && id !== fileId) {
        fileId = id;
        currentXml = null;
      }
      if (fileId && currentXml === null && !loading) {
        loadDiagram();
      }
    }

    function filesFrom(payload) {
      if (!payload) return null;
      const f = payload.files?.[0] || payload.fileAction?.files?.[0];
      if (f?.id) return { id: f.id, name: f.name || f.filename };
      if (payload.fileId) return { id: payload.fileId, name: payload.fileName };
      return null;
    }

    async function getAppToken() {
      if (window.fynncloud?.context?.token) return window.fynncloud.context.token;
      const res = await window.fynncloud?.getToken?.();
      if (res?.token) {
        if (window.fynncloud.context) window.fynncloud.context.token = res.token;
        return res.token;
      }
      return null;
    }

    function getApiBase() {
      if (window.fynncloud?.context?.apiBase) return window.fynncloud.context.apiBase;
      return window.location.origin;
    }

    async function api(path, init = {}) {
      const token = await getAppToken();
      if (!token) throw new Error('No active FynnCloud app session token.');
      const res = await fetch(`${getApiBase()}${path}`, {
        ...init,
        headers: { Authorization: `Bearer ${token}`, ...init.headers }
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res;
    }

    async function loadDiagram() {
      loading = true;
      try {
        const res = await api(`/api/files/${fileId}/download`);
        const text = await res.text();
        // A freshly created file is empty: start from a blank diagram.
        currentXml = text.trim() ? text : BLANK_DIAGRAM;
      } catch (err) {
        // Do not substitute a blank diagram here: an autosave would overwrite the real file.
        console.error('[Drawio] Failed to load diagram:', err);
        toast('Could not load the diagram', 'error');
        loadingEl.textContent = 'Could not load the diagram.';
        return;
      } finally {
        loading = false;
      }
      dispatchToDrawio();
    }

    function dispatchToDrawio() {
      if (!drawioReady || currentXml === null || !iframe.contentWindow) return;
      iframe.contentWindow.postMessage(JSON.stringify({
        action: 'load',
        autosave: 1,
        xml: currentXml,
        title: fileName
      }), '*');
      loadingEl.classList.add('hidden');
    }

    // Save over the existing file with the multipart update flow (initiate -> part -> complete).
    async function writeFile(xml) {
      const body = new TextEncoder().encode(xml);
      const init = await (await api('/api/files/multipart/initiate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fileID: fileId,
          filename: fileName,
          contentType: 'application/xml',
          totalSize: body.byteLength
        })
      })).json();

      // Parts and completion authenticate with the session token returned by initiate.
      const sessionHeaders = { Authorization: `Bearer ${init.token}` };
      const base = `${getApiBase()}/api/files/multipart/${init.sessionID}`;
      const parts = [];
      const chunk = Math.max(1, init.maxChunkSize);
      for (let offset = 0, n = 1; offset < body.byteLength; offset += chunk, n++) {
        const res = await fetch(`${base}/part/${n}`, {
          method: 'PUT',
          headers: sessionHeaders,
          body: body.slice(offset, offset + chunk)
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        parts.push(await res.json());
      }
      const done = await fetch(`${base}/complete`, {
        method: 'POST',
        headers: { ...sessionHeaders, 'Content-Type': 'application/json' },
        body: JSON.stringify({ parts })
      });
      if (!done.ok) throw new Error(`HTTP ${done.status}`);
    }

    async function save(xml, isAutosave) {
      currentXml = xml;
      if (isSaving) {
        queuedXml = xml;
        return;
      }
      isSaving = true;
      try {
        let next = xml;
        while (next) {
          queuedXml = null;
          await writeFile(next);
          next = queuedXml;
        }
        status('Saved to FynnCloud');
        if (!isAutosave) toast(`Saved "${fileName}"`, 'success');
      } catch (err) {
        console.error('[Drawio] Save failed:', err);
        status('Save failed', true);
        toast(`Failed to save: ${err.message}`, 'error');
      } finally {
        isSaving = false;
      }
    }

    function status(message, modified = false) {
      iframe.contentWindow?.postMessage(JSON.stringify({ action: 'status', message, modified }), '*');
    }

    function toast(message, type) {
      window.fynncloud?.showToast?.(message, type);
    }

    window.addEventListener('message', (event) => {
      if (event.source !== iframe.contentWindow || typeof event.data !== 'string') return;
      let msg;
      try {
        msg = JSON.parse(event.data);
      } catch {
        return;
      }

      switch (msg.event) {
        case 'configure':
          iframe.contentWindow.postMessage(JSON.stringify({ action: 'configure', config: {} }), '*');
          break;
        case 'init':
          drawioReady = true;
          dispatchToDrawio();
          break;
        case 'save':
        case 'autosave':
          if (msg.xml) save(msg.xml, msg.event === 'autosave');
          break;
        case 'exit':
          window.fynncloud?.close?.();
          break;
      }
    });

    if (window.fynncloud) {
      window.fynncloud.init();

      window.fynncloud.on('init', (ctx) => {
        if (ctx.theme) document.documentElement.classList.toggle('dark', ctx.theme === 'dark');
        const target = filesFrom(ctx) || (fileId ? { id: fileId, name: fileName } : null);
        if (target) setFile(target.id, target.name);
      });

      window.fynncloud.on('fileAction', (payload) => {
        const target = filesFrom(payload);
        if (target) setFile(target.id, target.name);
      });

      window.fynncloud.on('themeChange', ({ theme }) => {
        document.documentElement.classList.toggle('dark', theme === 'dark');
      });

      // Renewing the session failed: further saves will be rejected once the current token expires.
      window.fynncloud.on('tokenError', ({ reason }) => {
        status('Session expired - changes can no longer be saved', true);
        toast(`Session could not be renewed: ${reason}. Copy your work or reopen the file.`, 'error');
      });
    }

    // With the host bridge the token only arrives with the init handshake, so loading starts there.
    if (!window.fynncloud) setFile(fileId, fileName);

    iframe.src = `https://embed.diagrams.net/?embed=1&ui=atlas&spin=1&proto=json&configure=1&saveAndExit=0&noSaveBtn=0&noExitBtn=0&dark=${isDark ? 1 : 0}`;
  </script>
</body>
</html>
